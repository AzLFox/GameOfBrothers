<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <defs>
    <linearGradient id="leather" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5c1818"/>
      <stop offset="35%" stop-color="#8b2424"/>
      <stop offset="65%" stop-color="#6b1a1a"/>
      <stop offset="100%" stop-color="#3a0c0c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0d98a"/>
      <stop offset="50%" stop-color="#c9a24d"/>
      <stop offset="100%" stop-color="#8b6914"/>
    </linearGradient>
    <linearGradient id="gem" x1="30%" y1="20%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#b8fff0"/>
      <stop offset="50%" stop-color="#3ec4a8"/>
      <stop offset="100%" stop-color="#1a6058"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- pages edge -->
  <rect x="58" y="14" width="10" height="68" rx="1" fill="#e8d4b0" stroke="#c4a87a" stroke-width="0.5"/>
  <rect x="62" y="16" width="6" height="64" fill="#f0e0c8"/>

  <!-- book cover -->
  <g filter="url(#shadow)">
    <path d="M18 12 L56 12 Q62 12 62 18 L62 78 Q62 84 56 84 L18 84 Q12 84 12 78 L12 18 Q12 12 18 12Z" fill="url(#leather)" stroke="url(#gold)" stroke-width="2.5"/>
  </g>

  <!-- spine -->
  <rect x="12" y="12" width="8" height="72" rx="2" fill="#2a0808" stroke="url(#gold)" stroke-width="1"/>

  <!-- corner ornaments -->
  <path d="M16 16 L24 16 L16 24 Z" fill="url(#gold)" opacity="0.9"/>
  <path d="M52 16 L44 16 L52 24 Z" fill="url(#gold)" opacity="0.9"/>
  <path d="M16 80 L24 80 L16 72 Z" fill="url(#gold)" opacity="0.9"/>
  <path d="M52 80 L44 80 L52 72 Z" fill="url(#gold)" opacity="0.9"/>

  <!-- inner frame -->
  <rect x="22" y="20" width="34" height="56" rx="1" fill="none" stroke="url(#gold)" stroke-width="1" opacity="0.55"/>

  <!-- rune symbol -->
  <circle cx="39" cy="42" r="12" fill="none" stroke="url(#gold)" stroke-width="1.2" opacity="0.7"/>
  <path d="M39 32 L39 52 M33 38 L45 38 M33 46 L45 46" stroke="url(#gold)" stroke-width="1.5" stroke-linecap="round" opacity="0.85"/>

  <!-- gem clasp -->
  <g filter="url(#glow)">
    <rect x="14" y="42" width="10" height="12" rx="2" fill="url(#gold)" stroke="#8b6914" stroke-width="0.8"/>
    <rect x="16" y="44" width="6" height="8" rx="1" fill="url(#gem)" stroke="#e8c97a" stroke-width="0.6"/>
  </g>

  <!-- strap -->
  <path d="M8 30 L14 30 L14 66 L8 66 Z" fill="#4a2810" stroke="url(#gold)" stroke-width="1"/>
  <rect x="6" y="44" width="6" height="8" rx="1" fill="url(#gold)"/>

  <!-- sparkle -->
  <circle cx="50" cy="22" r="1.5" fill="#fff8d0" opacity="0.6"/>
</svg>

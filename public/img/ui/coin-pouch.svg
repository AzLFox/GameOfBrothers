<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 108" width="96" height="108">
  <defs>
    <linearGradient id="pouch-leather" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6b3a18"/>
      <stop offset="40%" stop-color="#9a5a28"/>
      <stop offset="70%" stop-color="#7a4518"/>
      <stop offset="100%" stop-color="#4a2810"/>
    </linearGradient>
    <linearGradient id="pouch-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0d98a"/>
      <stop offset="50%" stop-color="#c9a24d"/>
      <stop offset="100%" stop-color="#8b6914"/>
    </linearGradient>
    <linearGradient id="pouch-shadow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#2a1408" stop-opacity="0"/>
      <stop offset="100%" stop-color="#1a0c04" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="pouch-highlight" cx="35%" cy="28%" r="55%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="pouch-drop" x="-25%" y="-15%" width="150%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- hanging strap -->
  <path d="M42 4 Q48 0 54 4 L52 14 L44 14 Z" fill="url(#pouch-gold)" stroke="#8b6914" stroke-width="0.8"/>
  <rect x="46" y="2" width="4" height="6" rx="1" fill="#8b6914"/>

  <g filter="url(#pouch-drop)">
    <!-- body -->
    <path d="M20 24 Q48 18 76 24 L82 78 Q48 98 14 78 Z" fill="url(#pouch-leather)" stroke="url(#pouch-gold)" stroke-width="2"/>
    <path d="M20 24 Q48 18 76 24 L82 78 Q48 98 14 78 Z" fill="url(#pouch-highlight)"/>

    <!-- drawstring rim -->
    <ellipse cx="48" cy="24" rx="30" ry="7" fill="none" stroke="url(#pouch-gold)" stroke-width="2.2"/>
    <path d="M18 24 Q48 14 78 24" fill="none" stroke="#5c3010" stroke-width="3" stroke-linecap="round"/>
    <circle cx="24" cy="25" r="2.2" fill="url(#pouch-gold)"/>
    <circle cx="48" cy="21" r="2.4" fill="url(#pouch-gold)"/>
    <circle cx="72" cy="25" r="2.2" fill="url(#pouch-gold)"/>

    <!-- inner shadow -->
    <ellipse cx="48" cy="30" rx="22" ry="5" fill="url(#pouch-shadow)"/>

    <!-- peeking coins -->
    <ellipse cx="38" cy="31" rx="7" ry="2.2" fill="#b87333" stroke="#8b5a20" stroke-width="0.6"/>
    <ellipse cx="52" cy="30" rx="7.5" ry="2.4" fill="#d4d4d8" stroke="#9a9aa8" stroke-width="0.6"/>
    <ellipse cx="46" cy="33" rx="6" ry="2" fill="#e8c040" stroke="#b8860b" stroke-width="0.6"/>

    <!-- stitch lines -->
    <path d="M24 42 Q48 50 72 42" fill="none" stroke="#5c3010" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.55"/>
    <path d="M22 58 Q48 66 74 58" fill="none" stroke="#5c3010" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.45"/>

    <!-- clasp -->
    <rect x="42" y="72" width="12" height="10" rx="2" fill="url(#pouch-gold)" stroke="#8b6914" stroke-width="0.8"/>
    <circle cx="48" cy="77" r="2.5" fill="#6b4e2a"/>
  </g>

  <!-- opening target for coin drop (invisible guide) -->
  <ellipse cx="48" cy="24" rx="14" ry="4" fill="none" stroke="none" data-opening="true"/>
</svg>

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a0604">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Gates of Beyond · Лист персонажа</title>
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet"></noscript>
  <link rel="stylesheet" href="css/gob-tokens.css">
  <link rel="stylesheet" href="css/character.css">
  <link rel="stylesheet" href="css/gob-art.css">
  <link rel="stylesheet" href="css/gob-polish.css">
  <script src="js/gob-transition-guard.js"></script>
  <script src="js/gob-mobile.js"></script>
</head>
<body>
  <div class="char-page">
    <header class="char-header">
      <a href="/" class="char-back">← К миру</a>
      <h1 class="char-header-title">Лист персонажа</h1>
      <button type="button" id="btn-transfer" class="btn-transfer" title="Экспорт / Импорт">
        Перенос ↕
      </button>
      <span class="save-hint" id="save-hint" aria-live="polite"></span>
    </header>

    <aside class="slot-editor panel" id="slot-editor" hidden>
      <header class="slot-editor-header">
        <h2 class="panel-title" id="slot-editor-title">Предмет</h2>
        <button type="button" class="slot-editor-close" id="slot-editor-close" aria-label="Закрыть редактор">×</button>
      </header>
      <div class="slot-editor-body">
        <div class="slot-class-section" id="slot-class-section" hidden>
          <label class="field-label">Класс</label>
          <div class="slot-class-picker" id="slot-class-picker"></div>
          <label class="field-label">Тир</label>
          <div class="slot-tier-picker" id="slot-tier-picker"></div>
          <p class="slot-req-hint" id="slot-req-hint" hidden></p>
          <div class="slot-mods" id="slot-mods"></div>
        </div>
        <label class="field-label" for="slot-name">Название</label>
        <input type="text" class="field-input" id="slot-name" autocomplete="off" spellcheck="false">
        <label class="field-label" for="slot-desc">Описание</label>
        <textarea class="field-input" id="slot-desc" rows="5" spellcheck="false"></textarea>
      </div>
    </aside>

    <div class="char-sheet-wrap">
    <div class="char-layout">
      <aside class="portrait-panel">
        <div class="portrait-frame">
          <img id="char-img" alt="" loading="lazy" decoding="async" width="240" height="320">
        </div>
        <div class="char-identity">
          <label class="field-label" for="char-name">Имя</label>
          <input type="text" class="field-input field-input--name" id="char-name" autocomplete="off" spellcheck="false">
          <label class="field-label" for="char-desc">Описание</label>
          <textarea class="field-input field-input--desc" id="char-desc" rows="4" spellcheck="false"></textarea>
        </div>
      </aside>

      <section class="stats-panel panel">
        <h2 class="panel-title">Характеристики</h2>
        <div class="stats-grid" id="stats-grid"></div>
      </section>

      <section class="combat-panel panel">
        <h2 class="panel-title">Боевые показатели</h2>
        <div class="combat-grid" id="combat-grid"></div>
      </section>

      <section class="backpack-panel panel">
        <h2 class="panel-title">Рюкзак</h2>
        <div class="backpack-frame">
          <div class="backpack-slots" id="backpack-slots"></div>
        </div>
      </section>

      <section class="lore-panel panel">
        <h2 class="panel-title">История</h2>
        <textarea class="field-input field-input--lore" id="char-lore" rows="8" placeholder="Предыстория, заметки, приключения…" spellcheck="false"></textarea>
      </section>

      <section class="equipment-panel panel">
        <h2 class="panel-title">Обмундирование</h2>
        <div class="equipment-layout">
          <div class="equipment-grid" id="equipment-grid"></div>
        </div>
      </section>
    </div>
    </div>

    <div id="combat-tooltip" class="combat-tooltip" hidden role="tooltip"></div>

    <button type="button" class="spellbook-btn" id="spellbook-btn" aria-label="Книга заклинаний" title="Книга заклинаний">
      <img class="spellbook-icon" src="/img/spellbook-icon.svg" alt="" width="80" height="80" draggable="false">
      <span class="spellbook-label">Заклинания</span>
    </button>

    <dialog class="spellbook-modal" id="spellbook-modal">
      <div class="spellbook-open" role="document">
        <div class="spellbook-frame">
          <div class="spellbook-gold-shell">
            <span class="spellbook-ornament spellbook-ornament--tl" aria-hidden="true"></span>
            <span class="spellbook-ornament spellbook-ornament--tr" aria-hidden="true"></span>
            <span class="spellbook-ornament spellbook-ornament--bl" aria-hidden="true"></span>
            <span class="spellbook-ornament spellbook-ornament--br" aria-hidden="true"></span>

            <button type="button" class="spellbook-close" id="spellbook-close" aria-label="Закрыть">
              <span aria-hidden="true">✕</span>
            </button>

            <div class="spellbook-strap" aria-hidden="true">
              <span class="spellbook-strap-leather"></span>
              <span class="spellbook-buckle"></span>
            </div>

            <div class="spellbook-well">
              <div id="spellbook-mount" class="spellbook-mount">
                <div class="spellbook-spine-overlay" aria-hidden="true"></div>
                <div id="spellbook-flip-root" class="spellbook-flip-root"></div>
              </div>
            </div>

            <nav class="spellbook-tabs" id="spellbook-tabs" aria-label="Специализации"></nav>

          <footer class="spellbook-footer">
            <button type="button" class="spell-create-btn" id="spell-create-btn">
              <span class="spell-create-icon" aria-hidden="true">✦</span>
              Создать заклинание
            </button>
            <div class="spellbook-page-nav">
              <button type="button" class="spell-page-btn spell-page-btn--prev" id="spell-page-prev" aria-label="Предыдущий разворот" hidden>
                <span aria-hidden="true">‹</span>
              </button>
              <span class="spell-page-indicator" id="spell-page-indicator"></span>
              <button type="button" class="spell-page-btn spell-page-btn--next" id="spell-page-next" aria-label="Следующий разворот" hidden>
                <span aria-hidden="true">›</span>
              </button>
            </div>
          </footer>
          </div>
        </div>

        <aside class="spell-editor panel" id="spell-editor" hidden>
          <div class="spell-editor-preview" id="spell-editor-preview" aria-hidden="true">
            <div class="spell-icon-wrap spell-icon-wrap--damage" id="spell-editor-preview-wrap">
              <div class="spell-icon-ring">
                <div class="spell-icon-art spell-icon-art--damage" id="spell-editor-preview-art"></div>
              </div>
            </div>
          </div>
          <header class="spell-editor-header">
            <h3 id="spell-editor-title">Новое заклинание</h3>
            <button type="button" class="spell-editor-close" id="spell-editor-close" aria-label="Закрыть редактор">×</button>
          </header>
          <label class="field-label" for="spell-name">Название</label>
          <input type="text" class="field-input" id="spell-name" autocomplete="off" spellcheck="false">
          <label class="field-label">Специализация</label>
          <div class="spell-spec-picker" id="spell-spec-picker"></div>
          <label class="field-label">Значок</label>
          <div class="spell-icon-picker" id="spell-icon-picker"></div>
          <div class="spell-editor-row">
            <div>
              <label class="field-label" for="spell-level">Уровень</label>
              <input type="number" class="field-input field-input--small" id="spell-level" min="1" max="5" value="1">
            </div>
            <div>
              <label class="field-label" for="spell-mana">Мана</label>
              <input type="number" class="field-input field-input--small" id="spell-mana" min="0" max="99" value="0">
            </div>
          </div>
          <label class="field-label" for="spell-desc">Описание</label>
          <textarea class="field-input" id="spell-desc" rows="5" spellcheck="false"></textarea>
          <div class="spell-editor-actions">
            <button type="button" class="spell-delete-btn" id="spell-delete-btn" hidden>Удалить</button>
            <button type="button" class="spell-save-btn" id="spell-save-btn">Сохранить</button>
          </div>
        </aside>
      </div>
      <div id="spell-tooltip" class="spell-tooltip" hidden role="tooltip"></div>
    </dialog>
  </div>

  <script src="/vendor/gsap/gsap.min.js" defer></script>
  <script src="js/gob-sound.js" defer></script>
  <script src="js/gob-motion.js" defer></script>
  <script src="js/character-motion.js" defer></script>
  <script src="js/item-catalog.js" defer></script>
  <script src="js/character.js" defer></script>

  <div id="gob-page-wipe" class="gob-page-wipe" aria-hidden="true" hidden>
    <div class="gob-page-wipe__void"></div>
    <div class="gob-page-wipe__mist"></div>
    <div class="gob-page-wipe__crack" aria-hidden="true"></div>
    <div class="gob-page-wipe__runes" aria-hidden="true">
      <span class="gob-page-wipe__rune" style="--rx:10%;--ry:14%">ᚠ</span>
      <span class="gob-page-wipe__rune" style="--rx:88%;--ry:12%">ᚢ</span>
      <span class="gob-page-wipe__rune" style="--rx:6%;--ry:48%">ᚦ</span>
      <span class="gob-page-wipe__rune" style="--rx:92%;--ry:52%">ᚨ</span>
      <span class="gob-page-wipe__rune" style="--rx:14%;--ry:84%">ᚱ</span>
      <span class="gob-page-wipe__rune" style="--rx:86%;--ry:82%">ᚲ</span>
      <span class="gob-page-wipe__rune" style="--rx:50%;--ry:6%">ᛟ</span>
      <span class="gob-page-wipe__rune" style="--rx:48%;--ry:90%">ᛞ</span>
    </div>
    <div class="gob-page-wipe__sigil" aria-hidden="true">ᛟ</div>
  </div>

  <div class="gob-cinematic" aria-hidden="true">
    <div class="gob-cinematic__vignette"></div>
    <div class="gob-cinematic__grain"></div>
  </div>
</body>
</html>
